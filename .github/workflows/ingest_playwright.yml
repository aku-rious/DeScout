name: Tier 3 Playwright Scrape

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install
        working-directory: scripts

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
        working-directory: scripts

      - name: Verify repository secrets
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "::error::SUPABASE_URL repository secret is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY repository secret is not set."
            exit 1
          fi

      - name: Run scrapes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        working-directory: scripts
        run: |
          node ingest/lfx_scrape.mjs
          node ingest/dorahacks_scrape.mjs
          node ingest/gsoc_scrape.mjs
          node ingest/outreachy_scrape.mjs
          node ingest/hyperledger_scrape.mjs
          node ingest/lfn_scrape.mjs
